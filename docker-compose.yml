name: ragamuffin

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: ragamuffin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  layout:
    build: ./layout-service
    container_name: ragamuffin-layout
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5002"
    volumes:
      - layout-models:/root/.paddlex

volumes:
  pgdata:
  layout-models:
